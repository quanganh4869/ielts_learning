server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      prefix: access_log
      suffix: .log
      pattern: "%h %l %u %t \"%r\" %s %b (%D ms)"
      buffered: false

spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: ielts-admin-backend-dev
  datasource:
    url: jdbc:h2:mem:ielts_dev_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  admin-email: ${APP_ADMIN_EMAIL:admin@ieltsplatform.com,anhquangnguyen2k4@gmail.com,quanganhqb04@gmail.com} # Admin emails allowed to hold administrative privileges
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  chatbot:
    provider: fallback
    api-key: mock-dev-api-key
    model: gpt-4o-mini
    temperature: 0.3
    max-tokens: 1200
    timeout-seconds: 25
    rate-limit-per-minute: 50
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  auth:
    cookie-secure: false
    session-timeout-seconds: 86400
    redirect-allowlist:
      - http://localhost:5173
      - http://localhost:5173/admin
      - http://localhost:5173/app/dashboard
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

supabase:
  url: ${SUPABASE_URL:}
  jwks-uri: ${SUPABASE_JWKS_URI:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}
  issuer: ${SUPABASE_ISSUER:}
  audience: ${SUPABASE_AUDIENCE:authenticated}

cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    bucket-name: ${R2_BUCKET_NAME:ielts-platform-storage}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    endpoint: ${R2_ENDPOINT:}
    public-url-prefix: ${R2_PUBLIC_URL_PREFIX:}
    upload-ttl-seconds: 600
    download-ttl-seconds: 900

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
