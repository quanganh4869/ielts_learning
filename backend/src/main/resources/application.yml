server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ielts-admin-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ielts_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# Application Security, Admin Privilege & Session Configuration
app:
  admin-email: ${APP_ADMIN_EMAIL:} # Injected strictly via environment or secret manager (NEVER hardcoded)
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  auth:
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    session-timeout-seconds: ${APP_SESSION_TTL:86400}
    redirect-allowlist:
      - ${APP_FRONTEND_URL:http://localhost:5173}
      - ${APP_FRONTEND_URL:http://localhost:5173}/admin
      - ${APP_FRONTEND_URL:http://localhost:5173}/app/dashboard
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# Actuator & Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: when_authorized

# SpringDoc OpenAPI Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
