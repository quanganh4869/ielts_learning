server:
  port: 0
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:h2:mem:ielts_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - openid
              - profile
              - email

app:
  admin-email: "admin.test@example.com"
  frontend-url: "http://localhost:5173"
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  auth:
    cookie-secure: false
    session-timeout-seconds: 3600
    redirect-allowlist:
      - http://localhost:5173
      - http://localhost:5173/admin
      - http://localhost:5173/app/dashboard
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

supabase:
  jwt-secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  audience: authenticated

cloudflare:
  r2:
    bucket-name: test-bucket
    access-key-id: test-access-key
    secret-access-key: test-secret-key
    endpoint: http://localhost:9000
