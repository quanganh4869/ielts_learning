# IELTS AI - Training & Fine-Tuning Configuration

model_alias: "qwen2.5-0.5b"
model_name: "Qwen/Qwen2.5-0.5B-Instruct"

# Training Strategy: SFT with LoRA
training_type: "sft" # sft
use_lora: true
use_qlora: false # Set true for 4-bit QLoRA on Linux/WSL2 with CUDA

# LoRA Hyperparameters (Conservative default for stability)
lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

# Training Arguments
training_args:
  output_dir: "models/checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  save_total_limit: 2
  load_best_model_at_end: false
  max_seq_length: 512
  fp16: false # Set true if CUDA GPU supports fp16/bf16
  bf16: false
  optim: "adamw_torch"
  seed: 42
  report_to: "none" # "none" or "tensorboard"

# Dataset paths
datasets:
  train_file: "data/splits/train.jsonl"
  val_file: "data/splits/val.jsonl"
  test_file: "data/splits/test.jsonl"

# Output adapter directory
export:
  adapter_dir: "models/adapters"
  version_prefix: "ielts-tutor"
