<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <defs>
    <linearGradient id="grmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" rx="16" fill="url(#grmBg)"/>
  <circle cx="160" cy="90" r="64" stroke="#16A34A" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Grammar Matrix & Tree Structure -->
  <g transform="translate(110, 48)">
    <rect x="0" y="8" width="100" height="68" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5"/>
    <!-- Checklist items with checkmarks -->
    <circle cx="18" cy="26" r="6" fill="#DCFCE7"/>
    <path d="M15 26 L17 28 L21 24" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="26" x2="84" y2="26" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>

    <circle cx="18" cy="42" r="6" fill="#DCFCE7"/>
    <path d="M15 42 L17 44 L21 40" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="42" x2="72" y2="42" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>

    <circle cx="18" cy="58" r="6" fill="#DCFCE7"/>
    <path d="M15 58 L17 60 L21 56" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="58" x2="62" y2="58" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(18, 18)">
    <rect width="84" height="24" rx="12" fill="#16A34A" fill-opacity="0.15"/>
    <text x="42" y="16" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#15803D" text-anchor="middle">GRAMMAR</text>
  </g>
</svg>
