<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <defs>
    <linearGradient id="lisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="lisWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" rx="16" fill="url(#lisBg)"/>
  <!-- Circular Ripple Patterns -->
  <circle cx="160" cy="90" r="70" stroke="#0284C7" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="160" cy="90" r="54" stroke="#0284C7" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="160" cy="90" r="38" fill="#FFFFFF" fill-opacity="0.9"/>
  
  <!-- Headphones Art -->
  <path d="M125 96 C125 76 140 62 160 62 C180 62 195 76 195 96" stroke="#0284C7" stroke-width="7" stroke-linecap="round"/>
  <!-- Left Ear Cup -->
  <rect x="117" y="90" width="16" height="28" rx="8" fill="#0369A1"/>
  <rect x="121" y="94" width="8" height="20" rx="4" fill="#E0F2FE"/>
  <!-- Right Ear Cup -->
  <rect x="187" y="90" width="16" height="28" rx="8" fill="#0369A1"/>
  <rect x="191" y="94" width="8" height="20" rx="4" fill="#E0F2FE"/>

  <!-- Audio Waveform Graphic underneath -->
  <g transform="translate(60, 136)">
    <rect x="0" y="8" width="4" height="16" rx="2" fill="url(#lisWave)"/>
    <rect x="8" y="4" width="4" height="24" rx="2" fill="url(#lisWave)"/>
    <rect x="16" y="0" width="4" height="32" rx="2" fill="url(#lisWave)"/>
    <rect x="24" y="6" width="4" height="20" rx="2" fill="url(#lisWave)"/>
    <rect x="32" y="10" width="4" height="12" rx="2" fill="url(#lisWave)"/>
    <rect x="40" y="2" width="4" height="28" rx="2" fill="url(#lisWave)"/>
    <rect x="48" y="7" width="4" height="18" rx="2" fill="url(#lisWave)"/>
    
    <rect x="152" y="7" width="4" height="18" rx="2" fill="url(#lisWave)"/>
    <rect x="160" y="2" width="4" height="28" rx="2" fill="url(#lisWave)"/>
    <rect x="168" y="10" width="4" height="12" rx="2" fill="url(#lisWave)"/>
    <rect x="176" y="6" width="4" height="20" rx="2" fill="url(#lisWave)"/>
    <rect x="184" y="0" width="4" height="32" rx="2" fill="url(#lisWave)"/>
    <rect x="192" y="4" width="4" height="24" rx="2" fill="url(#lisWave)"/>
    <rect x="200" y="8" width="4" height="16" rx="2" fill="url(#lisWave)"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(18, 18)">
    <rect width="84" height="24" rx="12" fill="#0284C7" fill-opacity="0.12"/>
    <text x="42" y="16" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#0369A1" text-anchor="middle">LISTENING</text>
  </g>
</svg>
